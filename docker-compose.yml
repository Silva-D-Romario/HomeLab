services:
  # ==================== STREAM DE MÍDIA ====================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    volumes:
      - ./config/jellyfin:/config
      - ./config/jellyfin/cache:/cache
      - ./Movies:/media/Movies
      - ./Tv Shows:/media/Tv\ Shows
      - ./Animes:/media/Animes
      - ./Music:/media/Music
    ports:
      - "8096:8096"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    devices:
      - /dev/dri:/dev/dri

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    volumes:
      - ./config/qbittorrent:/config
      - ./downloads:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    volumes:
      - ./config/sonarr:/config
      - ./Tv Shows:/media/Tv\ Shows
      - ./Animes:/media/Animes
      - ./downloads:/downloads
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    volumes:
      - ./config/radarr:/config
      - ./Movies:/media/Movies
      - ./downloads:/downloads
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    environment:
      - LOG_LEVEL=debug
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/jellyseerr:/app/config

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    volumes:
      - ./config/lidarr:/config
      - ./Music:/music
      - ./downloads:/downloads
    ports:
      - "8686:8686"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo

  # ==================== GERENCIAMENTO ====================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000"

  # ==================== UTILIDADES ====================
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: always
    ports:
      - "8088:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    # healthcheck e outros já são padrão da imagem

  withoutbg:
    image: withoutbg/withoutbg-openweights-v3-app-cpu:latest
    container_name: withoutbg
    restart: always
    ports:
      - "8081:8080"
    environment:
      - TZ=America/Sao_Paulo
    # healthcheck e configurações já são padrão da imagem

volumes:
  portainer_data: